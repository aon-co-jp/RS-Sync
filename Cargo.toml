[workspace]

[package]
name = "rs-sync"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Git repository sync/backup tool across GitHub/RS-Git/Gitea/Gitbucket (MVP: one-way mirror sync fully working; two-way + realtime detection scaffolded)"
repository = "https://github.com/aon-co-jp/RS-Sync"

[lib]
name = "rs_sync"
path = "src/lib.rs"

[[bin]]
name = "rs-sync"
path = "src/main.rs"

[dependencies]
poem = { version = "3.1", features = ["static-files", "test"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
thiserror = "1"
# 2026-08-07: `ssh2`(libssh2 FFIバインディング、OpenSSL/openssl-sys依存)から
# pure-Rust実装へ置き換え(Androidクロスビルド阻害の解消、
# `src/folder_sync.rs`のモジュールdoc参照)。open-web-server側`sftp.rs`が
# 既に実機検証済みのバージョンに揃える。
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"
walkdir = "2"
smb2 = "0.16.1"
# 2026-08-27: TOTPセットアップ画面に実際のQRコード(スマホのカメラ/
# 認証アプリで撮影・読み取り可能な画像)を追加するため。pure Rust実装
# (ネイティブC依存無し)、SVGレンダリング機能のみ使用しビットマップ画像
# ライブラリへの依存は増やさない。既存のテキストシークレット表示
# (ガラケー等QRを読めない端末向け、open-easy-web側と同じ設計方針)は
# 維持したまま、QRコードを追加のオプションとして併記する。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 2026-08-28: 週次ログメール送信(ユーザー指示「ログの送信依頼は、
# 1週間に一度圧縮して...送付」)でログをgzip圧縮してメール添付するため。
# pure Rust実装、ネイティブC依存無し。
flate2 = "1"

[dev-dependencies]
tempfile = "3"
