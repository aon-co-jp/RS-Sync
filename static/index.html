<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>RS-Sync</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#0b0e14;color:#e6e6e6}
h1{font-size:1.4rem} h2{font-size:1.1rem;margin-top:2rem;border-bottom:1px solid #333;padding-bottom:.3rem}
input,select{padding:.3rem;margin:.2rem 0;background:#1a1f2b;color:#eee;border:1px solid #444}
button{padding:.4rem .8rem;background:#3a6ea5;color:#fff;border:none;cursor:pointer;margin:.2rem}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
td,th{border-bottom:1px solid #333;padding:.3rem;text-align:left;font-size:.9rem}
pre{white-space:pre-wrap;background:#111;padding:.5rem;font-size:.8rem}
.pill{padding:.1rem .4rem;border-radius:.3rem;font-size:.75rem}
.ok{background:#1e5b2f}.err{background:#7a2020}.conflict{background:#8a5a10}
#langBtn{float:right}
</style>
</head>
<body>
<button id="langBtn">EN</button>
<h1 data-i18n="title">RS-Sync — Gitリポジトリ同期ツール</h1>
<p data-i18n="intro">GitHub / open-gitea / Gitea / Gitbucket 間でリポジトリを一方向バックアップ同期・双方向同期します。</p>

<h2 data-i18n="accountsH">アカウント</h2>
<div id="accounts"></div>
<details><summary data-i18n="addAccount">アカウントを追加</summary>
<form id="accForm">
<input name="name" placeholder="表示名" required>
<select name="provider"><option>GitHub</option><option>OpenGitea</option><option>Gitea</option><option>Gitbucket</option></select><br>
<input name="api_base" placeholder="API base (例 https://api.github.com)" required style="width:100%">
<input name="git_base" placeholder="git base (例 https://github.com)" required style="width:100%">
<input name="owner" placeholder="owner/org" required>
<input name="token" type="password" placeholder="token" required>
<button type="submit" data-i18n="save">保存</button>
</form>
</details>

<h2 data-i18n="jobsH">同期ジョブ</h2>
<div id="jobs"></div>
<details><summary data-i18n="addJob">ジョブを追加</summary>
<form id="jobForm">
<input name="name" placeholder="ジョブ名" required><br>
<span data-i18n="source">ソース</span>: <select name="source_account_id" id="srcSel"></select>
<span data-i18n="dest">宛先</span>: <select name="dest_account_id" id="dstSel"></select><br>
<select name="direction"><option value="OneWay" data-i18n="oneway">一方向</option><option value="TwoWay" data-i18n="twoway">双方向</option></select><br>
<input name="repos" placeholder="repo1,repo2 (空欄=全リポジトリ)"><br>
<span data-i18n="everyHours">何時間ごと</span>: <input name="every_hours" type="number" min="1">
<span data-i18n="realtime">リアルタイム監視(分間隔)</span>: <input name="realtime_poll_minutes" type="number" min="1">
<button type="submit" data-i18n="save">保存</button>
</form>
</details>

<h2 data-i18n="logsH">実行ログ</h2>
<div id="logs"></div>

<script>
const dict = {
 ja: {title:"RS-Sync — Gitリポジトリ同期ツール", intro:"GitHub / open-gitea / Gitea / Gitbucket 間でリポジトリを一方向バックアップ同期・双方向同期します。",
   accountsH:"アカウント", addAccount:"アカウントを追加", save:"保存", jobsH:"同期ジョブ", addJob:"ジョブを追加",
   source:"ソース", dest:"宛先", oneway:"一方向", twoway:"双方向", everyHours:"何時間ごと", realtime:"リアルタイム監視(分間隔)",
   logsH:"実行ログ", run:"今すぐ同期", del:"削除", resolve:"解決済みにする"},
 en: {title:"RS-Sync — Git Repository Sync Tool", intro:"One-way backup or two-way sync of repositories across GitHub / open-gitea / Gitea / Gitbucket.",
   accountsH:"Accounts", addAccount:"Add account", save:"Save", jobsH:"Sync jobs", addJob:"Add job",
   source:"Source", dest:"Destination", oneway:"One-way", twoway:"Two-way", everyHours:"Every N hours", realtime:"Realtime poll (minutes)",
   logsH:"Run log", run:"Sync now", del:"Delete", resolve:"Mark resolved"}
};
let lang = "ja";
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(dict[lang][k]) el.textContent = dict[lang][k];
  });
  document.getElementById("langBtn").textContent = lang === "ja" ? "EN" : "JA";
}
document.getElementById("langBtn").onclick = ()=>{ lang = lang==="ja"?"en":"ja"; applyI18n(); renderAll(); };

async function api(path, opts){
  const r = await fetch(path, opts);
  return r.json();
}

async function renderAccounts(){
  const accs = await api("api/accounts");
  document.getElementById("accounts").innerHTML = accs.length ? (`<table><tr><th>${dict[lang].source}</th><th>Provider</th><th>Owner</th><th></th></tr>` +
    accs.map(a=>`<tr><td>${a.name}</td><td>${a.provider}</td><td>${a.owner}</td><td><button onclick="delAcc('${a.id}')">${dict[lang].del}</button></td></tr>`).join("") + "</table>")
    : "<p>-</p>";
  const opts = accs.map(a=>`<option value="${a.id}">${a.name}</option>`).join("");
  document.getElementById("srcSel").innerHTML = opts;
  document.getElementById("dstSel").innerHTML = opts;
  return accs;
}

async function renderJobs(accs){
  const jobs = await api("api/jobs");
  const accName = id => (accs.find(a=>a.id===id)||{}).name || id;
  document.getElementById("jobs").innerHTML = jobs.length ? (`<table><tr><th>Name</th><th>${dict[lang].source}</th><th>${dict[lang].dest}</th><th>Dir</th><th>Status</th><th></th></tr>` +
    jobs.map(j=>{
      const conflictBadges = (j.conflicted_repos||[]).map(r=>`<span class="pill conflict">${r} <a href="#" onclick="resolveConflict('${j.id}','${r}');return false;">[${dict[lang].resolve}]</a></span>`).join(" ");
      const statusPill = j.last_run_status ? `<span class="pill ${j.last_run_status==='ok'?'ok':'err'}">${j.last_run_status}</span>` : "-";
      return `<tr><td>${j.name}</td><td>${accName(j.source_account_id)}</td><td>${accName(j.dest_account_id)}</td><td>${j.direction}</td><td>${statusPill} ${conflictBadges}</td>
      <td><button onclick="runJob('${j.id}')">${dict[lang].run}</button><button onclick="delJob('${j.id}')">${dict[lang].del}</button></td></tr>`;
    }).join("") + "</table>") : "<p>-</p>";
}

async function renderLogs(){
  const logs = await api("api/logs");
  document.getElementById("logs").innerHTML = logs.map(l=>`<pre>[${l.started_at}] ${l.success?"OK":"ERR"}\n${l.message}</pre>`).join("");
}

async function renderAll(){
  const accs = await renderAccounts();
  await renderJobs(accs);
  await renderLogs();
}

async function delAcc(id){ await api("api/accounts/"+id, {method:"DELETE"}); renderAll(); }
async function delJob(id){ await api("api/jobs/"+id, {method:"DELETE"}); renderAll(); }
async function runJob(id){ const r = await api("api/jobs/"+id+"/run", {method:"POST"}); renderAll(); }
async function resolveConflict(id, repo){ await api(`api/jobs/${id}/resolve/${encodeURIComponent(repo)}`, {method:"POST"}); renderAll(); }

document.getElementById("accForm").onsubmit = async (e)=>{
  e.preventDefault();
  const f = new FormData(e.target);
  await api("api/accounts", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
    id:"", name:f.get("name"), provider:f.get("provider"), api_base:f.get("api_base"),
    git_base:f.get("git_base"), owner:f.get("owner"), token:f.get("token")
  })});
  e.target.reset(); renderAll();
};

document.getElementById("jobForm").onsubmit = async (e)=>{
  e.preventDefault();
  const f = new FormData(e.target);
  const repos = (f.get("repos")||"").split(",").map(s=>s.trim()).filter(Boolean);
  await api("api/jobs", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
    name:f.get("name"), source_account_id:f.get("source_account_id"), dest_account_id:f.get("dest_account_id"),
    direction:f.get("direction"), repos,
    schedule:{ every_hours: f.get("every_hours")?parseInt(f.get("every_hours")):null, days_of_week:[], hour:null, minute:null,
      realtime_poll_minutes: f.get("realtime_poll_minutes")?parseInt(f.get("realtime_poll_minutes")):null }
  })});
  e.target.reset(); renderAll();
};

applyI18n();
renderAll();
</script>
</body>
</html>
